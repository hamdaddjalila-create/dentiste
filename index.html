<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cabinet Dentaire - عيادة طب الأسنان</title>

  <!-- إعدادات الـ PWA والتثبيت على سطح المكتب موحدة داخل كود واحد -->
  <link rel="manifest" href='data:application/manifest+json,{
    "short_name": "Cabinet Dentaire",
    "name": "Cabinet Dentaire - عيادة طب الأسنان",
    "start_url": "./index.html",
    "background_color": "#ffffff",
    "theme_color": "#0d6efd",
    "display": "standalone",
    "icons": [
      {
        "src": "https://cdn-icons-png.flaticon.com/512/2818/2818366.png",
        "sizes": "192x192 512x512",
        "type": "image/png"
      }
    ]
  }'>

  <meta name="theme-color" content="#0d6efd">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cabinet Dentaire">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2818/2818366.png">

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
    }
  </style>
</head>
<body>

  <!-- ==================================================== -->
  <!-- ضع كود مشروعك وتطبيقك الحالي بالكامل في هذا المكان -->
  <!-- ==================================================== -->

  <!-- كود الجافاسكربت الموحد لتجهيز التثبيت للـ PWA -->
  <script>
    // تفعيل وتحديث الـ Service Worker موحداً عبر Data Blob
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      
      window.addEventListener('load', () => {
        navigator.serviceWorker.register(swUrl)
          .then(() => console.log('تطبيق الـ PWA جاهز للتثبيت!'))
          .catch((err) => console.log('SW Error:', err));
      });
    }
  </script>
</body>
</html>
